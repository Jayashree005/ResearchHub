# =============================================
# Research Hub - Application Configuration
# =============================================

# --- Database ---
# Change 'root' password to match your MySQL setup
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/research_hub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Seed Data (runs after schema creation) ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- File Upload ---
# Max PDF size: 50 MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Upload directory (relative to where the app is run)
file.upload-dir=uploads

# --- Server ---
server.port=8081
